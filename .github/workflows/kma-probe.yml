name: kma-access-probe
on:
  push:
    branches: [probe/kma-access]
    paths: ['.github/workflows/kma-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check reachability of KMA / data.go.kr endpoints (no key)
        run: |
          mkdir -p probe; out=probe/result.txt; : > $out
          for u in \
            "https://apis.data.go.kr/1360000/AsosHourlyInfoService/getWthrDataList?pageNo=1&numOfRows=1&dataType=JSON" \
            "https://apis.data.go.kr/1360000/Aws1miInfoService/getAws1miList" \
            "https://apihub.kma.go.kr/api/typ01/url/kma_sfctm2.php?tm=202610010000&stn=108&help=0" \
            "https://apihub.kma.go.kr/api/typ01/cgi-bin/url/nph-aws2_min?tm2=202610010000&stn=0&disp=0&help=1" \
            "https://data.kma.go.kr/" \
            "https://www.data.go.kr/" ; do
            echo "=== $u" >> $out
            curl -s -m 25 -o body.txt -w "HTTP %{http_code}  time %{time_total}s\n" "$u" >> $out || echo "CURL FAIL $?" >> $out
            head -c 400 body.txt | tr '\n' ' ' >> $out; echo >> $out; echo >> $out
          done
          echo "runner country: $(curl -s -m 10 https://ipinfo.io/country)" >> $out
          cat $out
      - name: Commit result
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add probe/result.txt && git commit -m "probe result" && git push

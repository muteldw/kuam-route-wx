name: rt-collect
# 준실시간 수집: 10분마다 영역 AWS·KIM 국지·ECMWF를 모아 rt-data 브랜치의 latest.json으로 올림
# 웹 콘솔(GitHub Pages)은 raw.githubusercontent.com/<저장소>/rt-data/latest.json 을 읽음
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/rt/collect.py, .github/workflows/rt-collect.yml]
permissions:
  contents: write
concurrency:
  group: rt-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Previous
        run: curl -sf -m 30 "https://raw.githubusercontent.com/${{ github.repository }}/rt-data/latest.json" -o prev.json || rm -f prev.json
      - name: Collect
        env:
          HUB: ${{ secrets.KMA_APIHUB_KEY }}
          PREV: prev.json
        run: python3 tools/rt/collect.py
      - name: Publish
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b rt-data
          git config user.name "github-actions"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# rt-data\n\nK-UAM 회랑 기상 콘솔 준실시간 자료(자동 생성, 매번 덮어씀). 생성 작업: .github/workflows/rt-collect.yml\n' > README.md
          git add -A && git commit -qm "rt $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" rt-data
